name: Publish to PyPI

# vX.Y.Z tag → PyPI; tags containing "rc" → TestPyPI. Creating a GitHub
# release pushes its tag, so the tag trigger alone covers releases (a separate
# release trigger would publish the same version twice).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  publish:
    uses: mazino2d/github-workflows/.github/workflows/pypi-publish.yml@v1
    with:
      python-version: "3.10"
      target: ${{ inputs.target || '' }}
    secrets: inherit

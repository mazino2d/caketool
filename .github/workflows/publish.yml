name: Publish to PyPI

# Release or vX.Y.Z tag → PyPI; tags containing "rc" → TestPyPI.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  publish:
    uses: mazino2d/github-workflows/.github/workflows/pypi-publish.yml@v1
    with:
      python-version: "3.10"
      target: ${{ inputs.target || '' }}
    secrets: inherit

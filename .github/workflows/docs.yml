name: Docs

# Blog + API reference on GitHub Pages. Pull requests only build; main deploys.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    uses: mazino2d/github-workflows/.github/workflows/pages.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      generator: mkdocs
      python-version: "3.10"
      install: pip install -e ".[docs]"
      pre-build: pdoc src/caketool -o docs/api/
      paths: |
        docs/**
        src/**
        mkdocs.yml
        pyproject.toml
        .github/workflows/docs.yml

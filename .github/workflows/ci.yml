name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: mazino2d/github-workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.10"
      install: pip install -e ".[dev,all]"
      run: |
        ruff check src/ tests/
        pytest tests/ -v --tb=short

  lint:
    if: github.event_name == 'pull_request'
    uses: mazino2d/github-workflows/.github/workflows/lint.yml@v1

  codeql:
    uses: mazino2d/github-workflows/.github/workflows/codeql-actions.yml@v1
    permissions:
      contents: read
      security-events: write
